{% extends 'auth_base.html' %}
{% block title %}Ro‘yxatdan o‘tish{% endblock %}
{% block form_content %}
    <span class="card-eyebrow">BIZGA QO‘SHILING</span>
    <h2 id="form-title">Hisob yaratish</h2>
    <p class="card-description">Ma’lumotlaringizni kiriting va o‘z hisobingizni oching.</p>
    <form class="auth-form" method="post" action="{% url 'register' %}">
        {% csrf_token %}
        {% include 'auth_fields.html' %}
        <button class="submit-button" type="submit">Ro‘yxatdan o‘tish <span aria-hidden="true">→</span></button>
    </form>
    <p class="auth-switch">Hisobingiz bormi? <a href="{% url 'login' %}">Kirish</a></p>
{% endblock %}
