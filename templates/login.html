{% extends 'auth_base.html' %}
{% block title %}Kirish{% endblock %}
{% block form_content %}
    <span class="card-eyebrow">XUSH KELIBSIZ</span>
    <h2 id="form-title">Hisobga kirish</h2>
    <p class="card-description">Davom etish uchun telefon raqamingiz va parolingizni kiriting.</p>
    <form class="auth-form login-form" method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {% include 'auth_fields.html' %}
        <button class="submit-button" type="submit">Kirish <span aria-hidden="true">→</span></button>
    </form>
    <p class="auth-switch">Hali hisobingiz yo‘qmi? <a href="{% url 'register' %}">Ro‘yxatdan o‘tish</a></p>
{% endblock %}
